{% extends "base.html" %}
{% block content %}
<div class="topbar">
  <h1>Users</h1>
  <a class="btn" href="{{ url_for('register') }}">+ Add User</a>
</div>
<div class="card">
  <table>
    <tr><th>Username</th><th>Role</th><th></th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td><span class="badge-role">{{ u.role }}</span></td>
      <td>{% if u.id != session.get('user_id') %}<a class="btn btn-danger btn-sm" href="{{ url_for('delete_user', id=u.id) }}" onclick="return confirm('Delete this user?')">Delete</a>{% endif %}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
